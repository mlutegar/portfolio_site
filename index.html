<!DOCTYPE html>

    <meta name="color-scheme" content="dark light" />

    <!-- Apply the persisted theme before paint to avoid a light flash (FOUC).
         Dark is the default when no preference has been saved yet. -->
    <script type="text/javascript">
      (function () {
        try {
          var stored = window.localStorage.getItem("isDark");
          var isDark = stored === null ? true : JSON.parse(stored);
          if (isDark) {
            document.documentElement.classList.add("dark-mode");
          }
        } catch (e) {
          document.documentElement.classList.add("dark-mode");
        }
      })();
    </script>

    <!-- Single Page Apps for GitHub Pages — decode the route from 404.html redirect -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
